name: iOS Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    name: Build FoodMap on macOS
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run core Swift tests
        run: swift test

      - name: Resolve Xcode packages
        run: |
          xcodebuild \
            -project FoodMap.xcodeproj \
            -scheme FoodMap \
            -resolvePackageDependencies

      - name: Build iOS app for simulator
        env:
          BUILD_GOOGLE_MAPS_API_KEY: ${{ env.GOOGLE_MAPS_API_KEY != '' && env.GOOGLE_MAPS_API_KEY || 'DUMMY_KEY_FOR_BUILD' }}
        run: |
          xcodebuild \
            -project FoodMap.xcodeproj \
            -scheme FoodMap \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            GOOGLE_MAPS_API_KEY="$BUILD_GOOGLE_MAPS_API_KEY" \
            build | tee xcodebuild.log

      - name: Package simulator app
        run: |
          APP_PATH="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -name 'FoodMap.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "FoodMap.app was not found in DerivedData."
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" FoodMap-simulator-app.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: FoodMap-simulator-app
          path: FoodMap-simulator-app.zip

      - name: Upload xcodebuild log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
